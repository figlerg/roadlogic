[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beamng-integration"
version = "0.0.1"
description = "A set of modules to ease working with BeamNG.tech"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beamngpy>=1.31",
]

[tool.setuptools]
packages = ["beamng_integration"]
package-dir = { beamng_integration  = "." }
